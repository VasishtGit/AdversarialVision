# Baseline Configuration for CIFAR-100 ResNet-18
experiment:
  name: "resnet18_cifar100_baseline"
  seed: 42
  device: "cuda"

dataset:
  name: "cifar100"
  data_dir: "./data"
  num_classes: 100
  train_split: 45000
  val_split: 5000
  test_split: 10000
  mean: [0.5071, 0.4867, 0.4408]
  std: [0.2675, 0.2565, 0.2761]
  num_workers: 2
  pin_memory: true

model:
  architecture: "resnet18_cifar"
  num_classes: 100
  in_channels: 3

training:
  batch_size: 128
  epochs: 200
  amp: true
  optimizer:
    name: "sgd"
    lr: 0.1
    momentum: 0.9
    weight_decay: 0.0005
    nesterov: true
  scheduler:
    name: "cosine"
    t_max: 200
    eta_min: 0.0001
  checkpoint:
    save_dir: "models/checkpoints"
    save_name: "resnet18_cifar100_best.pth"
    save_best_only: true
    monitor: "val_acc"

evaluation:
  batch_size: 256
  metrics: ["accuracy", "top5_accuracy", "loss", "mean_confidence", "latency"]
  attacks:
    epsilons: [0.00392156862, 0.00784313725, 0.0156862745, 0.031372549, 0.062745098, 0.125490196]
    pgd_steps: 10
  defenses:
    num_samples: 1000
    threat_eps: 0.031372549
  corruptions:
    severities: [1, 2, 3, 4, 5]

adversarial_training:
  method: "pgd"            # pgd | fast_fgsm | trades
  epochs: 50
  batch_size: 128
  eval_batch_size: 256
  lr: 0.05
  eps: 0.031372549        # 8.0 / 255.0
  alpha: 0.007843137      # 2.0 / 255.0
  steps: 7
  trades_beta: 6.0
  checkpoint:
    save_dir: "models/checkpoints"
    save_name: "resnet18_cifar100_adv_trained.pth"

